name: Verify proofs

on:
  push:
    paths:
      - "formal/**"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "formal/**"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    # This runner supports bubblewrap user namespaces without relaxing the sandbox.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: formal
      - name: Install proof-replay sandbox
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Record initial disk space
        run: df -h
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          lake-package-directory: formal
          build: "true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Record post-build disk space
        run: df -h
      - name: Audit axioms and replay every project proof
        working-directory: formal
        run: |
          set -o pipefail
          diagnostics="$RUNNER_TEMP/proof-replay"
          mkdir -p "$diagnostics"
          (
            while true; do
              {
                date -u '+%Y-%m-%d %H:%M:%S UTC'
                df -h
                free -m
                ps -eo pid,ppid,etime,rss,comm --sort=-rss | awk 'NR <= 12'
                for metric in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak; do
                  if [ -r "$metric" ]; then
                    printf '%s: ' "$metric"
                    cat "$metric"
                  fi
                done
              } | tee -a "$diagnostics/resources.log"
              sleep 45
            done
          ) &
          monitor_pid=$!
          cleanup_monitor() {
            pkill -P "$monitor_pid" 2>/dev/null || true
            kill "$monitor_pid" 2>/dev/null || true
            wait "$monitor_pid" 2>/dev/null || true
          }
          trap cleanup_monitor EXIT
          /usr/bin/time -v -o "$diagnostics/timing.txt" \
            bash replay-proofs.sh "$diagnostics" 2>&1 | tee "$diagnostics/checker.log"
      - name: Retain proof-replay diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-replay-diagnostics
          path: ${{ runner.temp }}/proof-replay/
          if-no-files-found: warn
          retention-days: 14
